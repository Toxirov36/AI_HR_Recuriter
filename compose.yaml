name: ai-hr-recruiter
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recruiter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-recruiter}
    ports: ['127.0.0.1:${POSTGRES_PORT:-5433}:5432']
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-recruiter}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-recruiter}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  frontend:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports: ['127.0.0.1:8080:80']
    depends_on: [backend]
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
