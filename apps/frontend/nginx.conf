limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
map $http_x_forwarded_proto $hsts_header {
  default "";
  https "max-age=31536000";
}

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy same-origin-allow-popups always;
  add_header Strict-Transport-Security $hsts_header always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; font-src 'self' data:; img-src 'self' data:; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  limit_req_status 429;
  limit_conn_status 429;

  location ~ ^/api/auth/(login|register|accept-invitation)$ {
    limit_req zone=auth_per_ip burst=10 nodelay;
    limit_conn connections_per_ip 10;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=40 nodelay;
    limit_conn connections_per_ip 20;
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 130s;
  }
  # Only known client routes receive the SPA shell. Unknown URLs must be real 404s.
  location = / { try_files /index.html =404; }
  location ~ ^/(login|register|privacy|dashboard|vacancies|candidates|pipeline|applications|admin|profile|team|platform-admin)/?$ {
    try_files /index.html =404;
  }
  location ~ ^/(candidates|applications)/[^/]+/?$ {
    try_files /index.html =404;
  }
  location ~ ^/apply/[^/]+/?$ {
    try_files /index.html =404;
  }
  location / { try_files $uri $uri/ =404; }
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    access_log off;
  }
}
