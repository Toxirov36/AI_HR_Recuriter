# Installed on the VM host, outside Docker. Obtain the certificate first.
limit_req_zone $binary_remote_addr zone=hr_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=hr_auth:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=hr_connections:10m;

server {
    listen 80;
    server_name 34.176.204.70;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://34.176.204.70$request_uri; }
}

server {
    listen 443 ssl;
    server_name 34.176.204.70;
    ssl_certificate /etc/letsencrypt/live/34.176.204.70/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/34.176.204.70/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    limit_req_status 429;
    limit_conn_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 130s;

    location ~ ^/api/auth/(login|register|accept-invitation)$ {
        limit_req zone=hr_auth burst=10 nodelay;
        limit_conn hr_connections 10;
        proxy_pass http://127.0.0.1:3000;
    }
    location /api/ {
        limit_req zone=hr_api burst=40 nodelay;
        limit_conn hr_connections 20;
        proxy_pass http://127.0.0.1:3000;
    }
    location / { proxy_pass http://127.0.0.1:8080; }
}
